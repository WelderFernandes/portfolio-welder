<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#c9d3d6"/>
  <!-- celular 1: cardápio -->
  <g transform="translate(150 40)">
    <rect width="230" height="470" rx="34" fill="#16181d"/>
    <rect x="10" y="10" width="210" height="450" rx="26" fill="#fafaf9"/>
    <rect x="85" y="20" width="60" height="8" rx="4" fill="#16181d"/>
    <text x="28" y="66" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Entregar em</text>
    <text x="28" y="84" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#111827">Rua das Flores, 120</text>
    <rect x="28" y="100" width="174" height="34" rx="17" fill="#f1f1ef"/>
    <text x="46" y="122" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">Buscar pratos ou restaurantes</text>
    <rect x="28" y="150" width="174" height="96" rx="14" fill="#e8541c"/>
    <text x="44" y="186" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#fff">Frete grátis</text>
    <text x="44" y="206" font-family="Arial, sans-serif" font-size="11" fill="#ffe3d6">nos pedidos de hoje</text>
    <g font-family="Arial, sans-serif">
      <rect x="28" y="262" width="174" height="58" rx="12" fill="#fff" stroke="#ececea"/>
      <rect x="38" y="272" width="38" height="38" rx="9" fill="#f6c453"/>
      <text x="88" y="288" font-weight="700" font-size="12" fill="#111827">Hambúrguer</text><text x="88" y="304" font-size="11" fill="#6b7280">25–35 min</text>
      <rect x="28" y="330" width="174" height="58" rx="12" fill="#fff" stroke="#ececea"/>
      <rect x="38" y="340" width="38" height="38" rx="9" fill="#7fb77e"/>
      <text x="88" y="356" font-weight="700" font-size="12" fill="#111827">Saladas</text><text x="88" y="372" font-size="11" fill="#6b7280">20–30 min</text>
    </g>
    <rect x="10" y="408" width="210" height="52" fill="#fff"/>
    <g fill="#d1d5db"><circle cx="60" cy="432" r="7"/><circle cx="115" cy="432" r="7"/><circle cx="170" cy="432" r="7"/></g>
    <circle cx="60" cy="432" r="7" fill="#e8541c"/>
  </g>
  <!-- celular 2: acompanhamento do pedido -->
  <g transform="translate(420 40)">
    <rect width="230" height="470" rx="34" fill="#16181d"/>
    <rect x="10" y="10" width="210" height="450" rx="26" fill="#eef1ef"/>
    <rect x="85" y="20" width="60" height="8" rx="4" fill="#16181d"/>
    <path d="M10 60 H220 V250 H10 Z" fill="#dfe7e3"/>
    <g stroke="#c4d1cb" stroke-width="10" fill="none"><path d="M10 120 H220 M10 200 H220 M80 60 V250 M160 60 V250"/></g>
    <path d="M60 220 C90 190 120 170 170 100" stroke="#e8541c" stroke-width="4" fill="none" stroke-dasharray="6 6"/>
    <circle cx="60" cy="220" r="9" fill="#1e3a46"/><circle cx="170" cy="100" r="9" fill="#e8541c"/>
    <rect x="10" y="250" width="210" height="210" fill="#fff"/>
    <text x="28" y="284" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#111827">Pedido a caminho</text>
    <text x="28" y="304" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Chega em cerca de 12 min</text>
    <rect x="28" y="320" width="174" height="6" rx="3" fill="#ececea"/><rect x="28" y="320" width="120" height="6" rx="3" fill="#e8541c"/>
    <g font-family="Arial, sans-serif" font-size="11" fill="#374151">
      <circle cx="36" cy="352" r="6" fill="#1e3a46"/><text x="50" y="356">Pedido confirmado</text>
      <circle cx="36" cy="378" r="6" fill="#1e3a46"/><text x="50" y="382">Em preparo</text>
      <circle cx="36" cy="404" r="6" fill="#e8541c"/><text x="50" y="408">Saiu para entrega</text>
    </g>
  </g>
